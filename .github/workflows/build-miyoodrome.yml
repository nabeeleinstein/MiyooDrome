name: Build MiyooDrome (ARM / OnionOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'navcore/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-miyoodrome.yml'

jobs:
  native-arm-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ARM hard-float cross toolchain and SDL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libsdl2-dev libsdl2-mixer-dev zip
          test -f /usr/include/SDL2/SDL.h
          test -f /usr/include/SDL2/SDL_mixer.h
          sudo mkdir -p /root/include/SDL2 /root/lib
          sudo cp -a /usr/include/SDL2/. /root/include/SDL2/
          sudo cp -a libs/. /root/lib/
          arm-linux-gnueabihf-gcc --version | head -1
      - name: Unit tests (host)
        run: go test ./navcore -count=1 -v
      - name: Compile real MiyooDrome binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '1'
          CC: arm-linux-gnueabihf-gcc
          CGO_LDFLAGS_ALLOW: '-Wl,.*'
        run: |
          go build -trimpath -o App/MiyooPod/MiyooPod ./src
          file App/MiyooPod/MiyooPod
          readelf -h App/MiyooPod/MiyooPod | grep -E 'Class:|Machine:'
          test "$(readelf -h App/MiyooPod/MiyooPod | awk '/Machine:/ {print $2}')" = 'ARM'
      - name: Package native app
        run: |
          mkdir -p dist/App
          cp -a App/MiyooPod dist/App/
          cp -a libs dist/App/MiyooPod/libs
          chmod +x dist/App/MiyooPod/MiyooPod dist/App/MiyooPod/launch.sh
          mkdir -p dist/App/MiyooPod/data
          cp INSTALL.md dist/INSTALL.md
          cp LICENSE dist/LICENSE
          (cd dist && zip -qr ../MiyooDrome-Native-ARM.zip App INSTALL.md LICENSE)
          sha256sum MiyooDrome-Native-ARM.zip > MiyooDrome-Native-ARM.zip.sha256
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MiyooDrome-Native-ARM
          path: |
            MiyooDrome-Native-ARM.zip
            MiyooDrome-Native-ARM.zip.sha256
          if-no-files-found: error
