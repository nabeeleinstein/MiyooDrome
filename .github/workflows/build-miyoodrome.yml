name: Build MiyooDrome for OnionOS
on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handheld:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
      - name: Test the Subsonic client
        run: make test
      - name: Prepare cross-compiler and SDL headers
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          curl -fsSL --retry 3 -o sdl.tar.gz https://www.libsdl.org/release/SDL2-2.28.5.tar.gz
          curl -fsSL --retry 3 -o mixer.tar.gz https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz
          sha256sum -c <<'SUMS'
          d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  zig.tar.xz
          332cb37d0be20cb9541739c61f79bae5a477427d79ae85e352089afdaf6666e4  sdl.tar.gz
          7a6ba86a478648ce617e3a5e9277181bc67f7ce9876605eea6affd4a0d6eea8f  mixer.tar.gz
          SUMS
          tar xf zig.tar.xz
          tar xf sdl.tar.gz SDL2-2.28.5/include
          tar xf mixer.tar.gz SDL2_mixer-2.6.3/include
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          echo "CGO_CFLAGS=-O2 -I$PWD/SDL2-2.28.5/include -I$PWD/SDL2_mixer-2.6.3/include" >> "$GITHUB_ENV"
      - name: Build and verify install ZIP
        run: |
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = test ]; then
            folder=MiyooDromeTest
            binary=dist/test-bin/MiyooDrome
            ARM_STRIP=llvm-strip-18 make package-test BUILD_ID="$(git rev-parse --short HEAD)"
          else
            folder=MiyooDrome
            binary=App/MiyooDrome/MiyooDrome
            ARM_STRIP=llvm-strip-18 make package
          fi
          echo "artifact=$folder-OnionOS" >> "$GITHUB_ENV"
          readelf -h "$binary" | grep 'Machine:.*ARM'
          readelf -l "$binary" | grep '/lib/ld-linux-armhf.so.3'
          unzip -tq "dist/$folder-OnionOS.zip"
          unzip -p "dist/$folder-OnionOS.zip" "App/$folder/MiyooDrome" | cmp - "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: dist/${{ env.artifact }}.zip
          if-no-files-found: error
